<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ניהול ראשי</title>
<link rel="preconnect" href="https://feshcsgtkfftmehbslyh.supabase.co" crossorigin>
<style>
:root{--bg:#f5f3ef;--card:#fff;--ink:#222;--muted:#777;--line:#e2ddd5;--accent:#2563eb;--bad:#b42318;--warn:#b54708}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1f1f1f;--ink:#eee;--muted:#999;--line:#333}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:16px 16px 60px}
h1{font-size:22px;margin:8px 0 16px}h2{font-size:18px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 2px}
input,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
button,.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 11px;cursor:pointer;text-decoration:none;display:inline-block}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.wa{background:#1fa855;border-color:#1fa855;color:#fff;font-weight:700}
.muted{color:var(--muted)}.bad{color:var(--bad);font-weight:700}.warn{color:var(--warn);font-weight:700}
.page{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row select,.row input{width:auto;flex:1;min-width:120px}
.ok{background:color-mix(in srgb,#1fa855 12%,var(--card));border-color:#1fa855}
.stats{display:flex;gap:8px;flex-wrap:wrap}.stats div{flex:1;min-width:110px;text-align:center}.stats b{display:block;font-size:22px}
</style>
</head>
<body>
<div class="wrap" id="app">טוען…</div>
<script src="config.js"></script>
<script src="presets.js"></script>
<script src="admin-lib.js"></script>
<script>
// ניהול ראשי (רק למנהלים — נבדק בשרת): פתיחת לקוח אחרי תשלום, חבילה, חידוש, ועריכת הדפים של הלקוחות
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const PLANS = { 1: 200, 3: 500, 5: 800 };
const pageUrl = slug => new URL('p/' + slug + '.html', location.href).href;
const editUrl = slug => 'edit.html?s=' + encodeURIComponent(slug) + '&super';
const wa = (phone, text) => `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
const days = d => Math.round((new Date(d) - new Date(new Date().toDateString())) / 864e5);
const fmt = d => new Date(d).toLocaleDateString('he-IL');
const typeOptions = () => Object.entries(PRESETS).map(([k, p]) => `<option value="${k}">${p.logo} ${p.label}</option>`).join('');
const pageContent = type => { const { label, name, phone, address, accent, logo, ...c } = structuredClone(PRESETS[type]); return { content: { ...c, type, template: 'classic' }, logo, accent }; };
const checkSlug = (id, v) => !v ? bad(id, 'צריך למלא כתובת לדף, למשל moshe-bakery') : /[^a-z0-9-]/.test(v) ? bad(id, 'בכתובת מותר רק אותיות באנגלית, מספרים ומקף')
  : v.length < 3 || v.length > 40 ? bad(id, 'הכתובת צריכה להיות באורך 3 עד 40 תווים') : true;
let LIST = [], DONE = null, Q = '';

function draw() {
  const soon = LIST.filter(c => c.renews_at && days(c.renews_at) <= 30), leads = LIST.reduce((n, c) => n + c.pages.reduce((m, p) => m + p.new_leads, 0), 0);
  const list = LIST.filter(c => !Q || JSON.stringify([c.email, c.settings, c.pages]).toLowerCase().includes(Q.toLowerCase()));
  $('app').innerHTML = `<h1>ניהול ראשי</h1>
  <div class="card stats"><div><b>${LIST.length}</b>לקוחות</div><div><b>${LIST.reduce((n, c) => n + (PLANS[c.page_limit] || 0), 0).toLocaleString('he-IL')} ₪</b>הכנסה שנתית</div>
    <div><b class="${soon.length ? 'warn' : ''}">${soon.length}</b>חידושים ב־30 יום</div><div><b>${leads}</b>פניות חדשות</div></div>
  ${DONE ? `<div class="card ok"><h2>✓ הלקוח נפתח: ${esc(DONE.name)}</h2><p>הדף: <a href="${pageUrl(DONE.slug)}" target="_blank" dir="ltr">${pageUrl(DONE.slug)}</a></p>
    <p class="muted">תמונת התצוגה בוואטסאפ תתעדכן תוך שעה. אפשר כבר לשלוח את הקישור.</p>
    <div class="tools"><a class="btn primary" href="${editUrl(DONE.slug)}">עריכת הדף</a>
    <a class="btn wa" target="_blank" href="${wa(DONE.phone, `שלום ${DONE.name}, הדף שלך מוכן 🎉\n${pageUrl(DONE.slug)}\n\nכדאי לשתף אותו בקבוצות ובסטטוס. לכל שינוי — שלחו לי הודעה כאן.`)}">שליחת הקישור ללקוח בוואטסאפ</a>
    <button data-act="closeDone">סגירה</button></div></div>` : ''}
  <div class="card"><h2>לקוח חדש (אחרי תשלום)</h2>
    <div class="grid2"><div><label>שם העסק</label><input id="n_name"></div><div><label>וואטסאפ של העסק</label><input id="n_phone" type="tel" inputmode="tel" placeholder="05..."></div>
    <div><label>מייל (לכניסה לעריכה בעתיד)</label><input id="n_email" type="email" dir="ltr"></div><div><label>תחום</label><select id="n_type">${typeOptions()}</select></div>
    <div><label>חבילה</label><select id="n_limit">${Object.entries(PLANS).map(([k, v]) => `<option value="${k}">${k === '1' ? 'דף אחד' : k + ' דפים'} · ${v} ₪ לשנה</option>`).join('')}</select></div>
    <div><label>כתובת לדף (באנגלית)</label><input id="n_slug" dir="ltr" placeholder="moshe-bakery"></div></div>
    <div class="tools"><button class="primary" data-act="create">פתיחת הלקוח והדף</button></div></div>
  <div class="card"><input id="q" placeholder="חיפוש לקוח (שם, מייל, טלפון, כתובת דף)" value="${esc(Q)}"></div>
  ${list.map(c => { const s = c.settings || {}, d = c.renews_at ? days(c.renews_at) : null, can = c.pages.length < c.page_limit;
    const st = d === null ? '' : d < -14 ? `<span class="bad">מושהה (פג לפני ${-d} ימים)</span>` : d < 0 ? `<span class="bad">פג לפני ${-d} ימים — יושהה בעוד ${14 + d}</span>` : d <= 30 ? `<span class="warn">חידוש בעוד ${d} ימים</span>` : `<span class="muted">חידוש ${fmt(c.renews_at)}</span>`;
    return `<div class="card"><div class="row" style="justify-content:space-between"><h2>${esc(s.logo || '')} ${esc(s.name || '(בלי שם)')}</h2>${st}</div>
    <div class="muted" dir="ltr" style="text-align:right">${esc(c.email)}${s.phone ? ' · 0' + esc(String(s.phone).replace(/^972/, '')) : ''}</div>
    ${c.pages.map(p => `<div class="page"><span dir="ltr">${esc(p.slug)}</span>${p.new_leads ? `<span class="warn">${p.new_leads} פניות חדשות</span>` : ''}
      <span class="tools" style="margin:0"><a class="btn" target="_blank" href="${pageUrl(p.slug)}">צפייה</a><a class="btn primary" href="${editUrl(p.slug)}">עריכה</a></span></div>`).join('')}
    ${can ? `<div class="row" style="margin-top:8px"><select id="t_${c.owner}">${typeOptions()}</select><input id="s_${c.owner}" dir="ltr" placeholder="כתובת לדף נוסף"><button data-act="addPage" data-o="${c.owner}">+ דף</button></div>` : ''}
    <div class="tools"><label style="margin:0">חבילה</label><select data-limit="${c.owner}" style="width:auto">${Object.keys(PLANS).map(k => `<option ${+k === c.page_limit ? 'selected' : ''} value="${k}">${k} · ${PLANS[k]} ₪</option>`).join('')}</select>
      <button data-act="renew" data-o="${c.owner}">שולם — חידוש לשנה</button>
      ${s.phone ? `<a class="btn wa" target="_blank" href="${wa(s.phone, `שלום ${s.name || ''}, המנוי לדף שלך מתחדש ב־${c.renews_at ? fmt(c.renews_at) : ''}. החידוש לשנה: ${PLANS[c.page_limit] || ''} ₪. איך נוח לך לשלם?`)}">תזכורת חידוש</a>` : ''}</div></div>`; }).join('') || '<p class="muted">אין לקוחות</p>'}`;
}
async function load() { const { data, error } = await sb.rpc('admin_customers'); if (error) throw error; LIST = data; draw(); }
const err = e => /slug taken|duplicate|unique/i.test(e.message) ? 'הכתובת הזו כבר תפוסה' : /customer exists/.test(e.message) ? 'למייל הזה כבר יש עסק — מוסיפים לו דף מהרשימה' : /limit/.test(e.message) ? 'הלקוח הגיע למכסת הדפים בחבילה' : 'שגיאה: ' + e.message;

document.addEventListener('input', e => { if (e.target.id === 'q') { Q = e.target.value; const pos = e.target.selectionStart; draw(); $('q').focus(); $('q').setSelectionRange(pos, pos); } });
document.addEventListener('change', async e => { const o = e.target.dataset.limit; if (!o) return;
  try { await sb.rpc('admin_set', { p_owner: o, p_limit: +e.target.value, p_renews: null }); msg('החבילה עודכנה ✓'); await load(); } catch (x) { msg('❌ ' + err(x)); } });
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return; const a = b.dataset.act;
  if (a === 'closeDone') { DONE = null; return draw(); }
  if (a === 'create') {
    const name = $('n_name').value.trim(), ph = $('n_phone').value.replace(/\D/g, ''), email = $('n_email').value.trim(), slug = $('n_slug').value.trim().toLowerCase(), type = $('n_type').value;
    if (!name) return bad('n_name', 'צריך למלא את שם העסק');
    if (!/^(05\d{8}|9725\d{8})$/.test(ph)) return bad('n_phone', ph ? 'מספר הוואטסאפ לא תקין — 10 ספרות שמתחילות ב־05' : 'צריך למלא את הוואטסאפ של העסק');
    if (!isMail(email)) return bad('n_email', email ? 'המייל לא תקין' : 'צריך למלא מייל');
    if (checkSlug('n_slug', slug) !== true) return;
    const { content, logo, accent } = pageContent(type), phone = ph.replace(/^0/, '972');
    b.disabled = true;
    try { await sb.rpc('admin_create', { p_email: email, p_settings: { name, phone, logo, accent }, p_limit: +$('n_limit').value, p_slug: slug, p_content: content }).then(r => { if (r.error) throw r.error; });
      DONE = { name, phone, slug }; await load(); scrollTo(0, 0); }
    catch (x) { b.disabled = false; /slug|unique|duplicate/i.test(x.message) ? bad('n_slug', err(x)) : /customer exists/.test(x.message) ? bad('n_email', err(x)) : msg('❌ ' + err(x)); }
  }
  if (a === 'addPage') {
    const o = b.dataset.o, slug = $('s_' + o).value.trim().toLowerCase(); if (checkSlug('s_' + o, slug) !== true) return;
    try { const r = await sb.rpc('admin_add_page', { p_owner: o, p_slug: slug, p_content: pageContent($('t_' + o).value).content }); if (r.error) throw r.error; location.href = editUrl(slug); }
    catch (x) { /slug|unique|duplicate/i.test(x.message) ? bad('s_' + o, err(x)) : msg('❌ ' + err(x)); }
  }
  if (a === 'renew') {
    const c = LIST.find(x => x.owner === b.dataset.o), base = c.renews_at && days(c.renews_at) > 0 ? new Date(c.renews_at) : new Date();
    base.setFullYear(base.getFullYear() + 1); const next = base.toISOString().slice(0, 10);
    if (!confirm(`לסמן ש${(c.settings || {}).name || 'הלקוח'} שילם ולחדש עד ${fmt(next)}?`)) return;
    try { const r = await sb.rpc('admin_set', { p_owner: c.owner, p_limit: null, p_renews: next }); if (r.error) throw r.error; msg('חודש עד ' + fmt(next) + ' ✓'); await load(); } catch (x) { msg('❌ ' + err(x)); }
  }
});

(async () => {
  if (!window.SUPABASE_URL) return $('app').textContent = 'הניהול הראשי עובד רק מול השרת';
  if (!(await connect())) return;
  if (!(await DB.isAdmin())) { const { data: { session } } = await sb.auth.getSession();
    $('app').innerHTML = `<h1>אין הרשאה</h1><p class="muted">העמוד מיועד למנהלי המערכת בלבד. מחובר כרגע: <b dir="ltr">${esc(session?.user?.email || '')}</b></p>
      <div class="tools"><button class="primary" id="out">יציאה וכניסה עם מייל אחר</button></div>`;
    return $('out').onclick = async () => { await sb.auth.signOut(); location.reload(); }; }
  try { await load(); } catch (x) { $('app').innerHTML = '<p>❌ ' + esc(err(x)) + '</p>'; }
})();
</script>
</body>
</html>
