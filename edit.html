<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><!-- שלב בדיקות: להסיר לפני השקה -->
<title>עריכת הדף</title>
<style>
:root{--bg:#f5f3ef;--card:#fff;--ink:#222;--muted:#777;--line:#e2ddd5;--accent:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1f1f1f;--ink:#eee;--muted:#999;--line:#333}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",Arial,sans-serif}
.wrap{max-width:720px;margin:auto;padding:16px 16px 100px}
h1{font-size:22px;margin:8px 0 16px}h2{font-size:18px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,textarea,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:90px}
.item{border-top:1px dashed var(--line);padding-top:8px;margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.item .full{grid-column:1/-1}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{position:fixed;inset:auto 0 0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;justify-content:center}
.bar button{flex:1;max-width:340px;padding:13px}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-inline-start:6px}
.pick{display:inline-block;margin:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer}
#msg{text-align:center;font-weight:700;min-height:22px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.presets button{padding:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app">טוען…</div>
<div class="bar" id="bar" hidden><button id="view">צפייה בדף</button><button class="primary" id="save">שמירה</button></div>
<script src="config.js"></script>
<script src="presets.js"></script>
<script>
// עורך כללי: שדות לכל סוג מקטע. התוכן נשמר כ-JSON אחד לכל עסק.
const slug = new URLSearchParams(location.search).get('s') || window.SITE_SLUG;
const FIELDS = {
  products: [['name', 'שם המוצר'], ['note', 'פירוט (משקל/כמות)'], ['price', 'מחיר ₪', 'number'], ['image', 'תמונה', 'image']],
  services: [['name', 'שם השירות'], ['price', 'מחיר (טקסט חופשי)'], ['desc', 'תיאור', 'full']],
  schedule: [['day', 'יום'], ['time', 'שעה'], ['what', 'מה (גיל/רמה)', 'full']],
  hours: [['day', 'ימים (למשל א׳–ה׳)'], ['open', 'פתיחה', 'time'], ['close', 'סגירה', 'time']],
  gallery: [['name', 'תיאור'], ['image', 'תמונה', 'image']],
  faq: [['q', 'שאלה', 'full'], ['a', 'תשובה', 'full']],
  testimonials: [['text', 'מה אמרו', 'full'], ['who', 'מי']],
};
const KINDS = { products: 'מחירון עם הזמנה', services: 'שירותים ומחירים', schedule: 'מערכת שעות', hours: 'שעות פתיחה', gallery: 'גלריית תמונות', faq: 'שאלות נפוצות', testimonials: 'המלצות', text: 'טקסט חופשי' };
let S = null, sb = null;
const $ = id => document.getElementById(id), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const msg = t => { const m = $('msg'); if (m) { m.textContent = t; setTimeout(() => m.textContent === t && (m.textContent = ''), 3000); } };

function field(path, label, val, type) {
  if (type === 'image') return `<div><label>${label}</label><label class="pick"><input type="file" accept="image/*" data-img="${path}" hidden>📷 ${val ? 'החלפה' : 'בחירת תמונה'}</label>${val ? `<img class="thumb" src="${esc(val)}">` : ''}</div>`;
  if (type === 'area') return `<div class="full"><label>${label}</label><textarea data-p="${path}">${esc(val)}</textarea></div>`;
  return `<div class="${type === 'full' ? 'full' : ''}"><label>${label}</label><input data-p="${path}" type="${type === 'number' || type === 'time' ? type : 'text'}" ${type === 'number' ? 'step="any" inputmode="decimal"' : ''} value="${esc(val)}"></div>`;
}
function draw() {
  if (!S) return $('app').innerHTML = `<h1>בחירת סוג הדף</h1><div class="presets">${Object.entries(PRESETS).map(([k, p]) => `<button data-preset="${k}">${p.logo}<br>${p.label}</button>`).join('')}</div>`;
  $('bar').hidden = false;
  $('app').innerHTML = `<h1>עריכת הדף</h1><div id="msg"></div>
  <div class="card"><h2>פרטים ראשיים</h2>
    ${field('name', 'שם העסק', S.name)}${field('tagline', 'משפט קצר מתחת לשם', S.tagline)}
    ${field('badge', 'תגית בולטת (למשל "הזמנות עד חמישי")', S.badge)}${field('cta', 'טקסט הכפתור הירוק', S.cta)}
    ${field('phone', 'וואטסאפ (למשל 0501234567)', S.phone ? '0' + String(S.phone).replace(/^972/, '') : '')}
    ${field('address', 'כתובת (לא חובה)', S.address)}
    ${field('image', 'תמונה ראשית (לא חובה)', S.image, 'image')}
    <label>צבע</label><input type="color" data-p="accent" value="${esc(S.accent)}">
  </div>
  ${S.sections.map((s, si) => `<div class="card"><div class="head"><h2>${esc(s.title)} <small class="muted">· ${KINDS[s.kind]}</small></h2>
      <label style="margin:0"><input type="checkbox" data-hide="${si}" ${s.hidden ? '' : 'checked'} style="width:auto"> מוצג</label></div>
    ${field(`sections.${si}.title`, 'כותרת', s.title)}
    ${s.kind === 'text' ? field(`sections.${si}.body`, 'תוכן (כל שורה בנפרד)', s.body, 'area') :
      s.items.map((it, ii) => `<div class="item">${FIELDS[s.kind].map(([k, l, t]) => field(`sections.${si}.items.${ii}.${k}`, l, it[k], t)).join('')}
        <div class="tools full"><button data-act="up" data-s="${si}" data-i="${ii}">↑</button><button data-act="down" data-s="${si}" data-i="${ii}">↓</button><button data-act="del" data-s="${si}" data-i="${ii}">מחיקה</button></div></div>`).join('') +
      `<div class="tools"><button data-act="add" data-s="${si}">+ הוספת שורה</button></div>`}
    <div class="tools"><button data-act="sup" data-s="${si}">הזזת המקטע למעלה</button><button data-act="sdel" data-s="${si}">מחיקת המקטע</button></div></div>`).join('')}
  <div class="card"><h2>הוספת מקטע</h2><select id="newKind">${Object.entries(KINDS).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select>
    <div class="tools"><button data-act="sadd">הוספה</button></div></div>`;
}
const setPath = (o, p, v) => { const k = p.split('.'); const last = k.pop(); k.reduce((a, x) => a[x], o)[last] = v; };
// הקטנת תמונה בדפדפן לפני העלאה — דף מהיר גם עם תמונות מהטלפון
async function shrink(file, max = 1200) {
  const img = await createImageBitmap(file), r = Math.min(1, max / Math.max(img.width, img.height));
  const c = Object.assign(document.createElement('canvas'), { width: Math.round(img.width * r), height: Math.round(img.height * r) });
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/webp', 0.8));
}
async function upload(blob) {
  if (!sb) return new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
  const path = `${slug}/${Date.now()}.webp`;
  const { error } = await sb.storage.from('tiny-sites-images').upload(path, blob, { contentType: 'image/webp' });
  if (error) throw error; return sb.storage.from('tiny-sites-images').getPublicUrl(path).data.publicUrl;
}
document.addEventListener('input', e => { const p = e.target.dataset.p; if (!p) return;
  let v = e.target.value; if (p === 'phone') v = v.replace(/\D/g, '').replace(/^0/, '972'); if (e.target.type === 'number') v = v === '' ? '' : +v; setPath(S, p, v); });
document.addEventListener('change', async e => {
  if (e.target.dataset.hide) { S.sections[e.target.dataset.hide].hidden = !e.target.checked; return; }
  const p = e.target.dataset.img; if (!p || !e.target.files[0]) return;
  msg('מעלה תמונה…'); try { setPath(S, p, await upload(await shrink(e.target.files[0]))); draw(); msg('התמונה נוספה'); } catch (err) { msg('שגיאה בהעלאה: ' + err.message); }
});
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.preset) { S = structuredClone(PRESETS[b.dataset.preset]); S.type = b.dataset.preset; delete S.label; return draw(); }
  const a = b.dataset.act, s = S && S.sections[b.dataset.s], i = +b.dataset.i;
  if (a === 'add') s.items.push({});
  if (a === 'del' && confirm('למחוק את השורה?')) s.items.splice(i, 1);
  if (a === 'up' && i > 0) [s.items[i - 1], s.items[i]] = [s.items[i], s.items[i - 1]];
  if (a === 'down' && i < s.items.length - 1) [s.items[i + 1], s.items[i]] = [s.items[i], s.items[i + 1]];
  if (a === 'sup' && +b.dataset.s > 0) { const k = +b.dataset.s; [S.sections[k - 1], S.sections[k]] = [S.sections[k], S.sections[k - 1]]; }
  if (a === 'sdel' && confirm('למחוק את כל המקטע?')) S.sections.splice(+b.dataset.s, 1);
  if (a === 'sadd') { const k = $('newKind').value; S.sections.push(k === 'text' ? { kind: k, title: KINDS[k], body: '' } : { kind: k, title: KINDS[k], items: [{}] }); }
  if (a) draw();
});
$('save').onclick = async () => {
  if (!sb) { localStorage.setItem('draft:' + slug, JSON.stringify(S)); return msg('נשמר (מצב בדיקה מקומי)'); }
  const { error } = await sb.from('tiny_sites').update({ content: S, updated_at: new Date().toISOString() }).eq('slug', slug);
  msg(error ? 'שגיאה בשמירה: ' + error.message : 'נשמר ✓ הדף מעודכן');
};
$('view').onclick = () => window.open('index.html?s=' + encodeURIComponent(slug), '_blank');

(async () => {
  if (!window.SUPABASE_URL) { const l = localStorage.getItem('draft:' + slug); S = l ? JSON.parse(l) : null; return draw(); }
  // כניסה עם קוד חד-פעמי למייל — בלי סיסמה לזכור
  await new Promise(r => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js'; sc.onload = r; document.head.append(sc); });
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    $('app').innerHTML = `<h1>כניסה לעריכה</h1><div class="card"><label>המייל שלך</label><input id="em" type="email" inputmode="email">
      <div class="tools"><button class="primary" id="send">שליחת קוד</button></div><div id="step2" hidden><label>הקוד שקיבלת במייל</label><input id="code" inputmode="numeric">
      <div class="tools"><button class="primary" id="ok">כניסה</button></div></div><div id="msg"></div></div>`;
    $('send').onclick = async () => { const { error } = await sb.auth.signInWithOtp({ email: $('em').value, options: { shouldCreateUser: false, emailRedirectTo: location.href } }); error ? msg(error.message) : ($('step2').hidden = false, msg('נשלח מייל — הקלידו את הקוד או לחצו על הקישור')); };
    $('ok').onclick = async () => { const { error } = await sb.auth.verifyOtp({ email: $('em').value, token: $('code').value.trim(), type: 'email' }); error ? msg('קוד שגוי') : location.reload(); };
    return;
  }
  const { data } = await sb.from('tiny_sites').select('content').eq('slug', slug).single();
  S = data && data.content && data.content.sections ? data.content : null; draw();
})();
</script>
</body>
</html>
