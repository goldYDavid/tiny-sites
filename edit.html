<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>עריכת הדף</title>
<link rel="preconnect" href="https://feshcsgtkfftmehbslyh.supabase.co" crossorigin>
<link rel="stylesheet" href="site.css">
<style>
/* סרגל העורך + מסך הכניסה */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:8px 12px}
.top .in{max-width:680px;margin:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.top a,.top button,.tools button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 11px;cursor:pointer;text-decoration:none}
.top .grow{flex:1}
.tpl{display:flex;gap:4px}.tpl button[aria-pressed=true]{outline:2px solid var(--accent);font-weight:700}
.primary{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important;font-weight:700}
#msg{text-align:center;font-weight:700;min-height:22px;font-size:14px;width:100%}
#msg:empty{display:none}
.wrap input,.wrap select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.wrap label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.addsec{margin-top:30px}
</style>
</head>
<body>
<div class="top" id="top" hidden><div class="in">
  <a id="back" href="admin.html">→ לניהול</a><span class="grow"></span>
  <span class="tpl" id="tpl"></span>
  <a id="view" target="_blank">צפייה</a><button class="primary" id="save">שמירה</button>
  <div id="msg"></div></div></div>
<div class="wrap" id="app">טוען…</div>
<script src="config.js"></script>
<script src="presets.js"></script>
<script src="render.js"></script>
<script src="admin-lib.js"></script>
<script>
// עריכה על הדף עצמו: הדף נראה כמו אצל הגולש, כל טקסט ניתן לשינוי במקום. "שמירה" ← מוצג מיד לגולש.
const slug = new URLSearchParams(location.search).get('s');
const KINDS = { products: 'מחירון עם הזמנה', services: 'שירותים ומחירים', schedule: 'מערכת שעות', hours: 'שעות פתיחה', gallery: 'גלריית תמונות', faq: 'שאלות נפוצות', testimonials: 'המלצות', text: 'טקסט חופשי', lead: 'טופס השארת פרטים' };
let C, BIZ, dirty = false;
const setPath = (o, p, v) => { const k = p.split('.'); const last = k.pop(); k.reduce((a, x) => a[x], o)[last] = v; };

function draw() {
  const site = { ...BIZ.settings, ...C };
  document.documentElement.style.setProperty('--accent', site.accent || '#c8741a');
  $('app').className = 'wrap ed t-' + (C.template || 'classic');
  $('app').innerHTML = renderSite(site, true) + `<div class="card addsec"><b>הוספת מקטע לדף</b>
    <select id="newKind">${Object.entries(KINDS).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select>
    <div class="tools"><button data-act="sadd">+ הוספת המקטע</button></div></div>`;
  $('tpl').innerHTML = Object.entries(TEMPLATES).map(([k, l]) => `<button data-tpl="${k}" aria-pressed="${(C.template || 'classic') === k}">${l}</button>`).join('');
}
const changed = () => { dirty = true; $('save').textContent = 'שמירה •'; };

document.addEventListener('input', e => { const el = e.target.closest('[data-p]'); if (!el) return;
  let v = el.innerText.replace(/\n$/, '');
  if (el.classList.contains('num')) { v = v.replace(/[^\d.]/g, ''); v = v === '' ? '' : +v; }
  setPath(C, el.dataset.p, v); changed(); });
// Enter בשדה של שורה אחת = סיום עריכה
document.addEventListener('keydown', e => { const el = e.target.closest('[data-p]'); if (el && e.key === 'Enter' && !el.classList.contains('ed-body')) { e.preventDefault(); el.blur(); } });
document.addEventListener('change', async e => {
  const p = e.target.dataset.img; if (!p || !e.target.files[0]) return;
  msg('מעלה תמונה…'); try { setPath(C, p, await DB.upload(slug, await shrink(e.target.files[0]))); changed(); draw(); msg('התמונה הועלתה ✓ — לחצו "שמירה"'); } catch (err) { msg('❌ שגיאה בהעלאה: ' + err.message); }
});
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tpl) { C.template = b.dataset.tpl; changed(); return draw(); }
  const a = b.dataset.act, si = +b.dataset.s, s = C.sections[si], i = +b.dataset.i, swap = (arr, x, y) => y >= 0 && y < arr.length && ([arr[x], arr[y]] = [arr[y], arr[x]]);
  if (!a) return;
  if (a === 'add') s.items.push({});
  if (a === 'del' && confirm('למחוק את השורה?')) s.items.splice(i, 1);
  if (a === 'up') swap(s.items, i, i - 1);
  if (a === 'down') swap(s.items, i, i + 1);
  if (a === 'sup') swap(C.sections, si, si - 1);
  if (a === 'sdown') swap(C.sections, si, si + 1);
  if (a === 'shide') s.hidden = !s.hidden;
  if (a === 'sdel' && confirm('למחוק את כל המקטע?')) C.sections.splice(si, 1);
  if (a === 'sadd') { const k = $('newKind').value; C.sections.push(k === 'text' ? { kind: k, title: KINDS[k], body: '' } : k === 'lead' ? { kind: k, title: 'השאירו פרטים', body: 'נחזור אליכם בהקדם', button: 'שליחה' } : { kind: k, title: KINDS[k], items: [{}] }); }
  changed(); draw();
});
$('save').onclick = async () => {
  try { await DB.savePage(slug, C); dirty = false; $('save').textContent = 'שמירה'; msg('נשמר ✓ הדף מעודכן'); } catch (err) { msg('❌ שגיאה בשמירה: ' + err.message); }
};
addEventListener('beforeunload', e => { if (dirty) e.preventDefault(); });

(async () => {
  $('back').href = href('admin.html'); $('view').href = href('index.html', 's=' + encodeURIComponent(slug));
  if (!(await connect())) return;
  [BIZ, C] = await Promise.all([DB.biz(), DB.page(slug)]);
  if (!C || !C.sections) return $('app').innerHTML = `<p>הדף לא נמצא. <a href="${href('admin.html')}">חזרה לניהול</a></p>`;
  $('top').hidden = false; draw();
})();
</script>
</body>
</html>
