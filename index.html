<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script>/* הכתובת הראשית בלי דף עסק (dafbiz.com/) ← דף הבית של השירות */ if (!location.search && /^\/(index(\.html)?)?$/.test(location.pathname)) location.replace('home' + location.hash)</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><!-- שלב בדיקות: להסיר לפני השקה -->
<title>טוען…</title>
<link rel="preconnect" href="https://feshcsgtkfftmehbslyh.supabase.co" crossorigin>
<link rel="stylesheet" href="site.css">
</head>
<body>
<div class="wrap" id="app"><div class="skel"></div></div>
<div class="bar"><a id="cta" href="#" target="_blank" rel="noopener">וואטסאפ</a></div>
<script src="config.js"></script>
<script src="render.js"></script>
<script src="presets.js"></script>
<script>
// הצגה: קודם מהמטמון (מיידי), ואז עדכון מהשרת ברקע
const qs = new URLSearchParams(location.search), slug = (qs.get('s') || window.PAGE_SLUG || window.SITE_SLUG).trim().toLowerCase().replace(/[^a-z0-9-]+$/, ''),  // קישור מוואטסאפ מגיע לפעמים עם נקודה/סוגריים בסוף או אותיות גדולות  // PAGE_SLUG: עותק קבוע של הדף ב-p/ (תצוגה מקדימה בוואטסאפ)
      demo = qs.get('demo'), pv = qs.has('pv');
if (pv) document.querySelector('.bar').style.display = 'none';  // pv: תצוגה מקדימה בתוך מסך הניהול — לא שולחים פניות והזמנות
let SITE, cart = {}, ORDER = { items: [] };
function render(site) {
  SITE = site; document.title = `${site.name} — ${site.tagline}`;
  applyColors(window.PV_COLORS || site);  // ראשי + משני לפי כלל ההרמוניה (config.js). PV_COLORS: תצוגה מקדימה מהניהול
  const app = document.getElementById('app'); app.className = 'wrap t-' + (site.template || 'classic');
  app.innerHTML = (site.draft ? '<div class="draft">טיוטה — הדף עוד לא מפורסם, ורק אתם רואים אותו</div>' : '') + renderSite(site, false, cart);
  update();
}
const money = n => (Math.round(n * 100) / 100).toLocaleString('he-IL', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });  // 5.9 ← 5.90
function update() {
  const lines = [], rows = []; let sum = 0;
  for (const [k, q] of Object.entries(cart)) if (q) { const [si, ii] = k.split('-'), it = SITE.sections[si].items[ii]; lines.push(`${q} × ${it.name}`); rows.push([q, it.name, q * it.price]); sum += q * it.price; }
  const a = document.getElementById('cta'); ORDER = { items: lines, rows, total: Math.round(sum * 100) / 100 };
  a.href = `https://wa.me/${SITE.phone}?text=${encodeURIComponent(`שלום, הגעתי מהאתר של ${SITE.name}`)}`; a.target = '_blank';
  a.textContent = lines.length ? `${SITE.cta || 'הזמנה בוואטסאפ'} · ${money(sum)} ₪` : (SITE.cta || 'וואטסאפ');
  if (demo && !lines.length) { a.href = 'admin.html'; a.removeAttribute('target'); a.textContent = 'רוצים דף כזה לעסק שלכם? בונים בחינם ←'; }  // דף לדוגמה ← הרשמה
  if (pv) a.removeAttribute('href');
}
// הודעת ההזמנה שנשלחת לבעל העסק בוואטסאפ
function orderText(b) {
  const w = Object.keys(payWays(SITE.pay)), paid = w.length === 1 ? `\nתשלום: ${w[0] === 'link' ? 'בקישור התשלום שבאתר' : 'ב' + PAY_WAYS[w[0]]}` : '';  // כמה אפשרויות ← הלקוח בוחר אחר כך
  return `שלום, אשמח להזמין:\n${ORDER.items.join('\n')}\nסה"כ: ${money(ORDER.total)} ₪${paid}\n\nשם: ${b.name}\nטלפון: ${b.phone}${b.note ? '\nהערה: ' + b.note : ''}`;
}
const sheet = (id, html) => { document.querySelectorAll('.paysheet').forEach(x => x.remove()); document.body.insertAdjacentHTML('beforeend', `<div class="paysheet" id="${id}" role="dialog"><button class="x" aria-label="סגירה">✕</button>${html}</div>`); };
// טופס פנייה (מקטע "השאירו פרטים") ← נשמר בפניות של בעל העסק + נפתחת הודעת וואטסאפ מוכנה אליו (כדי שיידע מיד)
document.addEventListener('submit', e => {
  if (e.target.id === 'orderform') return sendOrder(e);
  const f = e.target.closest('form[data-lead]'); if (!f) return; e.preventDefault();
  const { website, ...d } = Object.fromEntries(new FormData(f)), section = SITE.sections[f.dataset.lead].title;
  const thanks = '<p class="ok">✓ תודה! הפרטים התקבלו ונחזור אליכם בהקדם</p>';
  if (website) return f.innerHTML = thanks;  // שדה נסתר שרק תוכנות ספאם ממלאות
  if (demo || pv) return f.innerHTML = thanks + '<p class="muted">זו דוגמה — בדף שלכם הפנייה תגיע אליכם לוואטסאפ ולמסך הניהול</p>';
  sendLead(slug, 'lead', { ...d, section }).catch(() => {});
  const text = `שלום, השארתי פרטים באתר (${section}):\nשם: ${d.name}\nטלפון: ${d.phone}${d.message ? '\n' + d.message : ''}`;
  window.open(`https://wa.me/${SITE.phone}?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
  f.innerHTML = thanks + '<p class="muted">נפתחה הודעת וואטסאפ — לחצו "שליחה" כדי שבעל העסק יקבל אותה מיד</p>'; });
// לחיצה על כפתור ההזמנה (יש מוצרים בעגלה) ← סיכום + שם וטלפון, כדי שבעל העסק יוכל לחזור ללקוח גם אם הודעת הוואטסאפ לא נשלחה
document.getElementById('cta').addEventListener('click', e => { if (!ORDER.items.length || pv) return; e.preventDefault();
  let b = {}; try { b = JSON.parse(localStorage.getItem('buyer') || '{}'); } catch {}  // בהזמנה הבאה — כבר ממולא
  sheet('ordersheet', `<b>ההזמנה שלכם${demo ? ' (דוגמה)' : ''}</b>
    <div class="olines">${ORDER.rows.map(([q, n, t]) => `<p><span>${q} × ${esc(n)}</span><span>${money(t)} ₪</span></p>`).join('')}<p class="osum"><span>סה"כ</span><b>${money(ORDER.total)} ₪</b></p></div>
    <form id="orderform" class="lead">
      <input name="name" placeholder="שם" aria-label="שם" autocomplete="name" required value="${esc(b.name || '')}" oninvalid="this.setCustomValidity('צריך למלא שם')" oninput="this.setCustomValidity('')">
      <input name="phone" type="tel" inputmode="tel" placeholder="טלפון" aria-label="טלפון" autocomplete="tel" required pattern="[0-9 +\\-]{9,15}" value="${esc(b.phone || '')}" oninvalid="this.setCustomValidity(this.validity.valueMissing ? 'צריך למלא טלפון' : 'מספר הטלפון לא תקין')" oninput="this.setCustomValidity('')">
      <input name="note" placeholder="הערה (לא חובה) — למשל כתובת למשלוח" aria-label="הערה (לא חובה)">
      <button class="paybtn wa">שליחת ההזמנה בוואטסאפ</button>
      <small>ייפתח וואטסאפ עם ההזמנה מוכנה — שם לוחצים "שליחה"</small>
      <button class="nowa" data-nowa="1">אין לי וואטסאפ — שליחה ישירה לבעל העסק</button></form>`);
});
function sendOrder(e) { e.preventDefault();
  const b = Object.fromEntries(new FormData(e.target)); b.name = b.name.trim(); b.phone = b.phone.trim(); b.note = (b.note || '').trim();
  const text = orderText(b), url = `https://wa.me/${SITE.phone}?text=${encodeURIComponent(text)}`;
  if (demo) return sheet('ordersheet', `<b>כך זה עובד בדף שלכם</b><p class="muted">ההודעה הזו נפתחת בוואטסאפ של הלקוח, והוא שולח אותה אליכם. ההזמנה נשמרת גם במסך הניהול, עם השם והטלפון:</p>
    <pre class="wamsg">${esc(text)}</pre><a class="paybtn wa" href="admin.html">רוצים דף כזה? בונים בחינם ←</a>`);
  try { localStorage.setItem('buyer', JSON.stringify({ name: b.name, phone: b.phone })); } catch {}
  const nowa = e.submitter && e.submitter.dataset.nowa, data = { items: ORDER.items, total: ORDER.total, name: b.name, phone: b.phone, ...(b.note && { note: b.note }), ...(nowa && { nowa: true }) };
  // בלי וואטסאפ: ההזמנה נשמרת אצל בעל העסק (+ התראה בטלפון ובמייל), והוא חוזר ללקוח בטלפון. מחכים לאישור מהשרת
  if (nowa) { const btn = e.submitter; btn.disabled = true; btn.textContent = 'שולח…';
    return sendLead(slug, 'order', data).then(() => payNow(ORDER.total, `<div class="step">✓ <b>ההזמנה נשלחה לבעל העסק.</b> הוא יחזור אליכם לטלפון <b dir="ltr">${esc(b.phone)}</b>.</div>`),
      () => { btn.disabled = false; btn.textContent = 'אין לי וואטסאפ — שליחה ישירה לבעל העסק'; alert('לא הצלחנו לשלוח את ההזמנה. בדקו את החיבור לאינטרנט ונסו שוב, או התקשרו לבעל העסק: 0' + String(SITE.phone).replace(/^972/, '')); }); }
  sendLead(slug, 'order', data).catch(() => {});
  window.open(url, '_blank', 'noopener');
  payNow(ORDER.total, `<div class="step">📲 בוואטסאפ שנפתח לוחצים <b>"שליחה"</b> — כך בעל העסק יקבל את ההזמנה מיד.<br><a href="${url}" target="_blank" rel="noopener">וואטסאפ לא נפתח? לחצו כאן</a></div>`);
}
// אחרי הזמנה: תזכורת ללחוץ "שליחה" בוואטסאפ + כפתורי תשלום עם הסכום, לפי מה שבעל העסק בחר. הכסף עובר ישר אליו
function payNow(total, head) {
  const W = payWays(SITE.pay), ks = Object.keys(PAY_WAYS).filter(k => W[k] && (k === 'bit' ? W[k].phone || W[k].link : k === 'bank' ? W[k].details : k === 'cash' || W[k].link));
  const one = ks.length === 1, links = ks.filter(k => W[k].link), T = money(total);
  const row = k => { const v = W[k], ph = v.phone ? '0' + String(v.phone).replace(/^972/, '') : '';
    if (k === 'bit') return (v.link ? `<a class="paybtn" href="${esc(v.link)}" target="_blank" rel="noopener">תשלום בביט · ${T} ₪</a>` : '')
      + (ph ? `<p>${v.link ? 'או העברה' : 'העברה'} בביט למספר <b dir="ltr">${ph}</b> <button class="copy" data-copy="${ph}">העתקת המספר</button></p>` : '');
    if (k === 'bank') return `<div class="payrow"><b>העברה בנקאית</b><p style="white-space:pre-line">${esc(v.details)}</p><button class="copy" data-copy="${esc(v.details)}">העתקת הפרטים</button></div>`;
    if (k === 'cash') return `<div class="payrow"><b>💵 מזומן</b><p>אפשר לשלם במזומן באיסוף או במסירה</p></div>`;
    return `<a class="paybtn" href="${esc(v.link)}" target="_blank" rel="noopener">${k === 'link' ? (one ? 'לתשלום' : 'תשלום בכרטיס אשראי') : 'תשלום ב' + PAY_WAYS[k]} · ${T} ₪</a>`; };
  sheet('paysheet', `${head}
    ${ks.length ? `<p class="sum">לתשלום: <b>${T} ₪</b></p>${one ? '' : '<p class="muted">בחרו איך לשלם:</p>'}${ks.map(row).join('')}
    ${links.length ? `<small>בדף התשלום מקלידים את הסכום: ${T} ₪ (הסכום מועתק בלחיצה)</small>` : ''}` : ''}`);
}
// דף לדוגמה: התוכן של התבנית + פרטים ותמונות שנראים כמו עסק אמיתי (DEMOS ב-presets.js)
function demoSite(t) { const p = structuredClone(PRESETS[t] || PRESETS.food), d = (window.DEMOS || {})[t] || {};
  const site = { ...p, phone: '972500000000', name: d.name || p.name, address: d.address ?? p.address, template: qs.get('t') };
  for (const [k, v] of Object.entries(d.img || {})) { const [si, ii] = k.split('.'); site.sections[si].items[ii].image = v; }
  for (const [si, v] of Object.entries(d.text || {})) site.sections[si].body = v;
  if (d.gallery) site.sections.find(x => x.kind === 'gallery').items = d.gallery.map(image => ({ image, name: 'תמונה' }));
  return site; }
// בדף לדוגמה כפתורי יצירת הקשר לא מתקשרים לאף אחד — מסבירים מה הם יעשו בדף שלכם
document.addEventListener('click', e => { const a = demo && e.target.closest('.cbtns a'); if (!a) return; e.preventDefault();
  sheet('ordersheet', `<b>${esc(a.textContent)}</b><p>בדף שלכם הכפתור הזה ${/tel:/.test(a.href) ? 'מחייג אליכם' : /wa\.me/.test(a.href) ? 'פותח שיחת וואטסאפ איתכם' : 'פותח ניווט בוויז לכתובת העסק'} בלחיצה אחת.</p><a class="paybtn wa" href="admin.html">רוצים דף כזה? בונים בחינם ←</a>`); });
document.addEventListener('click', e => { const s = e.target.closest('.paysheet'); if (!s) return;
  if (e.target.closest('.x')) return s.remove();
  const c = e.target.closest('.copy'); if (c) navigator.clipboard?.writeText(c.dataset.copy).then(() => c.textContent = 'הועתק ✓', () => {});
  if (e.target.closest('.paybtn[target]')) navigator.clipboard?.writeText(String(ORDER.total)).catch(() => {}); });
document.addEventListener('click', e => { const b = e.target.closest('.qty button'); if (!b) return;
  const k = b.dataset.k; cart[k] = Math.max(0, (cart[k] || 0) + +b.dataset.d); document.getElementById('q' + k).textContent = cart[k]; update(); });

(async () => {
  if (demo) { render(demoSite(demo)); return document.getElementById('app').insertAdjacentHTML('afterbegin', `<div class="draft" style="background:#2563eb">דף לדוגמה — ${SITE.sections.some(x => x.kind === 'products') ? 'נסו להוסיף מוצרים ולהזמין' : 'כך ייראה הדף של העסק שלכם'} · <a href="admin.html" style="color:#fff">רוצים דף כזה?</a></div>`); }
  const key = 'site:' + slug;
  try { const c = localStorage.getItem(key); if (c) render(JSON.parse(c)); } catch {}
  const fresh = await window.loadSite(slug).catch(() => 'offline');  // בלי רשת ← נשארים עם העותק השמור
  if (fresh && fresh.paused) return closed('paused', fresh.name);
  if (fresh === 'offline') { if (!SITE) document.getElementById('app').innerHTML = '<p class="paused">אין חיבור לאינטרנט — נסו שוב</p>'; return; }
  if (fresh) { try { localStorage.setItem(key, JSON.stringify(fresh)); } catch {} if (JSON.stringify(fresh) !== JSON.stringify(SITE)) render(fresh); }
  else { const st = await fetch(`${SUPABASE_URL}/rest/v1/rpc/page_status`, { method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Profile': 'tiny', 'Content-Type': 'application/json' }, body: JSON.stringify({ p_slug: slug }) }).then(r => r.json()).catch(() => null);
    closed(st ? st.state : 'none', st && st.name); }
  // דף שהגולש לא יכול לראות: הסבר לפי הסיבה, ולבעל העסק — מה לעשות
  function closed(state, name) { try { localStorage.removeItem(key); } catch {} document.querySelector('.bar')?.remove();
    const n = name && name !== 'שם העסק' ? esc(name) : 'העסק', own = '<p class="own">בעל העסק? <a href="admin.html">כניסה לניהול הדף</a></p>';
    const M = { draft: [`הדף של ${n} עוד לא פורסם`, 'הדף ייפתח לציבור אחרי שבעל העסק יבחר חבילה וישלים את התשלום.', own],
      paused: [`הדף של ${n} מושהה`, 'המנוי השנתי של הדף לא חודש, ולכן הוא לא מוצג כרגע. הדף ייפתח שוב מיד אחרי החידוש.', own],
      live: ['הדף לא זמין כרגע', 'נסו לרענן בעוד כמה דקות.', ''],
      // מי שמגיע לכאן הוא בדרך כלל לקוח של עסק שקיבל קישור שגוי — קודם עוזרים לו להגיע לעסק, ורק בסוף הצעה למי שיש לו עסק
      none: ['לא מצאנו דף בכתובת הזו', `חיפשנו את הכתובת <b dir="ltr">${esc(slug)}</b> ולא מצאנו עסק כזה. ייתכן שהקישור לא הועתק במלואו או שיש בו טעות הקלדה.`,
        '<p>הכי פשוט: לבקש מבעל העסק לשלוח שוב את הקישור לדף שלו.</p><p class="own"><a class="lead-btn" style="background:#2563eb;text-decoration:none;color:#fff" href="home">לדף הבית</a></p><p class="own muted">יש לכם עסק? <a href="?demo=food">ראו דף לדוגמה</a> · <a href="home#how">איך בונים דף משלכם בחינם</a></p>'] }[state] || [];
    document.title = M[0]; document.getElementById('app').innerHTML = `<div class="paused"><h2>${M[0]}</h2><p>${M[1]}</p>${M[2]}</div>`; }
})();
</script>
</body>
</html>
