<!doctype html>
<html lang="he" dir="rtl" data-themed>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ניהול העסק</title>
<link rel="preconnect" href="https://feshcsgtkfftmehbslyh.supabase.co" crossorigin>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#2563eb">
<style>
:root{--bg:#f5f3ef;--card:#fff;--ink:#222;--muted:#777;--line:#e2ddd5;--accent:#2563eb}
:root[data-theme=dark]{--bg:#141414;--card:#1f1f1f;--ink:#eee;--muted:#999;--line:#333;color-scheme:dark}  /* בהיר כברירת מחדל גם כשהטלפון במצב כהה; כהה רק בבחירה (כפתור 🌙) */
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",Arial,sans-serif}
.wrap{max-width:720px;margin:auto;padding:16px 16px 60px}
h1{font-size:22px;margin:8px 0 16px}h2{font-size:18px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 2px}
input{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=color]{height:44px;padding:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}@media (max-width:640px){.grid2{grid-template-columns:1fr}}  /* בטלפון: שדה אחד בכל שורה, ברוחב מלא */
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-block}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}small{display:block}
.page{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.page:first-of-type{border:0}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
/* לוגו וחבילות מילוי */
.logo-pick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.logo-prev{width:56px;height:56px;object-fit:contain;border:1px solid var(--line);border-radius:12px;background:#fff}
.fills{display:grid;gap:8px}.fills button{text-align:right;padding:10px 12px}.fills button[aria-pressed=true]{outline:2px solid var(--accent)}.fills small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.needs{background:#fff4e5;color:#7a3e00;border-radius:10px;padding:10px;margin-top:10px;font-size:14px}.total{margin:12px 0 0;font-size:17px}
.types button{padding:12px;text-align:center}.types button[aria-pressed=true]{outline:2px solid var(--accent);font-weight:700}
#msg{text-align:center;font-weight:700;min-height:22px}
input:placeholder-shown,textarea:placeholder-shown{direction:rtl;text-align:right}  /* טקסט המילוי (placeholder) בעברית — מימין, גם בשדות שמקלידים בהם באנגלית */
</style>
</head>
<body>
<div class="wrap" id="app">טוען…</div>
<script src="config.js"></script>
<script src="presets.js"></script>
<script src="admin-lib.js"></script>
<script>
// ניהול: הגדרות כלליות של העסק + רשימת הדפים + יצירת דף חדש (עד מכסת החבילה)
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let BIZ, PAGES, NEWLEADS = 0, TYPE = 'seasonal', PAY;

// תשלום מהלקוחות: בעל העסק בוחר ביט / פייבוקס / קישור משלו / בלי. אחרי הזמנה הלקוח רואה כפתור תשלום עם הסכום
const A = (u, t) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`;
const PAY_HELP = {
  none: 'הלקוח שולח את ההזמנה בוואטסאפ, ואת התשלום אתם מסכמים איתו.',
  bit: `הלקוח מעביר לכם בביט למספר הטלפון שלכם — הסכום והמספר מוצגים לו אחרי ההזמנה.<br>אפשר להוסיף גם קישור: באפליקציית ביט לוחצים "קבוצה" ← איסוף כסף ← "סכום פתוח", ומשתפים את הלינק. שימו לב שקבוצה נסגרת בסוף התקופה שבחרתם.<br>ביט פרטי: קבלת כסף חינם עד 25,000 ₪ בשנה, מעבר לזה עמלה של 0.8%. ${A('https://www.bitpay.co.il/he/private-faq', 'שאלות נפוצות של ביט')} · ${A('https://www.bitpay.co.il/he/bit-for-businesses', 'ביט לעסקים')}`,
  paybox: `באפליקציית פייבוקס פותחים קבוצה ציבורית לתשלומים ומשתפים את הקישור שלה (לחיצה על "שיתוף" בקבוצה). מדביקים את הקישור כאן. הלקוח יקליד בפייבוקס את הסכום שמוצג לו. ${A('https://www.payboxapp.com/groups', 'קבוצות בפייבוקס')} · ${A('https://www.payboxapp.com/business', 'פייבוקס לעסקים')}`,
  link: 'דף תשלום שקיבלתם מחברת סליקה (למשל Grow, חשבונית ירוקה, Cardcom או PayPal). מדביקים כאן את הקישור, והלקוח יקליד בו את הסכום שמוצג לו.',
};
function payCard() {
  const p = BIZ.settings.pay || {}, m = PAY || p.method || 'none', phone = p.phone || BIZ.settings.phone;
  return `<h2>תשלום מהלקוחות</h2><small class="muted">הכסף עובר ישר אליכם. אחרי הזמנה הלקוח רואה כפתור תשלום עם הסכום</small>
    <div class="fills" style="margin-top:10px">${Object.entries(PAY_WAYS).map(([k, l]) => `<button data-pay="${k}" aria-pressed="${k === m}">${l}</button>`).join('')}</div>
    <p class="muted" style="font-size:14px">${PAY_HELP[m]}</p>
    ${m === 'bit' ? `<label>מספר הטלפון שמחובר לביט</label><input id="p_phone" inputmode="tel" value="${phone ? '0' + String(phone).replace(/^972/, '') : ''}">` : ''}
    ${m !== 'none' ? `<label>${m === 'bit' ? 'קישור לתשלום בביט (לא חובה)' : m === 'paybox' ? 'הקישור לקבוצה בפייבוקס' : 'הקישור לדף התשלום'}</label><input id="p_link" dir="ltr" inputmode="url" placeholder="מדביקים כאן את הקישור" value="${esc(p.method === m ? p.link : '')}">` : ''}
    <div class="tools"><button class="primary" id="savePay">שמירת אפשרות התשלום</button></div>`;
}

function draw() {
  const s = BIZ.settings, L = BIZ.page_limit, can = PAGES.length < L; PUB = published();
  $('app').innerHTML = `<h1>ניהול העסק</h1><div id="msg"></div>
  <a class="card head" style="display:flex;text-decoration:none;color:inherit" href="${href('leads.html')}"><h2>📥 פניות והזמנות</h2><span class="${NEWLEADS ? 'primary btn' : 'muted'}">${NEWLEADS ? NEWLEADS + ' חדשות' : 'אין חדשות'} ←</span></a>
  <div class="card"><h2>הגדרות העסק</h2><small class="muted">מופיעות בכל הדפים שלך</small>
    <div class="grid2"><div><label>שם העסק</label><input id="b_name" value="${esc(s.name)}"></div>
      <div><label>לוגו — תמונה (PNG, JPG או SVG), או אימוג'י</label><div class="logo-pick" id="logoPick">${logoPick(s)}</div></div>
      <div><label>וואטסאפ (למשל 0501234567)</label><input id="b_phone" inputmode="tel" value="${s.phone ? '0' + String(s.phone).replace(/^972/, '') : ''}"></div>
      <div><label>צבע ראשי</label><input id="b_accent" type="color" value="${esc(s.accent || '#c8741a')}"></div></div>
    <label>כתובת (לא חובה)</label><input id="b_address" value="${esc(s.address)}">
    <div class="tools"><button class="primary" id="saveBiz">שמירת ההגדרות</button></div></div>
  <div class="card" id="pay">${payCard()}</div>
  ${PUB ? `<div class="card" id="plan"><div class="head"><h2>החבילה שלי</h2><span class="muted">${L} ${L === 1 ? 'דף' : 'דפים'}${PLANS[L] ? ' · ' + PLANS[L] + ' ₪ לשנה' : ''}</span></div>
    <small class="muted">מתחדשת ב־${new Date(BIZ.renews_at).toLocaleDateString('he-IL')}</small>
    ${upgrades().length ? `<p class="muted">שדרוג באמצע השנה: משלמים רק את ההפרש, לפי החודשים שנשארו עד החידוש (${monthsLeft()} חודשים).</p><div class="tools">${upgrades().join('')}</div>` : ''}</div>` : publishCard()}
  <div class="card"><div class="head"><h2>הדפים שלי</h2><span class="muted">${PAGES.length} מתוך ${L} בחבילה</span></div>
    ${PAGES.length ? PAGES.map(p => `<div class="page"><div><b>${esc(p.content.tagline || (PRESETS[p.content.type] || {}).label || p.slug)}</b>
      <small class="muted" dir="ltr">${esc(p.slug)} · ${esc(TEMPLATES_LABEL[p.content.template] || 'קלאסי')}</small></div>
      <div class="tools" style="margin:0"><a class="btn primary" href="${href('edit.html', 's=' + encodeURIComponent(p.slug))}">עריכה</a>
      <a class="btn" href="${href('index.html', 's=' + encodeURIComponent(p.slug))}" target="_blank">צפייה</a>
      ${PUB ? `<button data-copy="${esc(p.slug)}">העתקת קישור</button>` : '<span class="muted">טיוטה</span>'}
      <button data-del="${esc(p.slug)}">מחיקה</button></div></div>`).join('') : '<p class="muted">עוד אין דפים — צרו את הראשון למטה</p>'}</div>
  <div class="card"><h2>דף חדש</h2>
    ${can ? `<label>סוג הדף</label><div class="types">${Object.entries(PRESETS).map(([k, p]) => `<button data-type="${k}" aria-pressed="${k === TYPE}">${p.logo}<br>${p.label}</button>`).join('')}</div>
      <label>כתובת הדף (אותיות באנגלית, מספרים ומקף)</label><input id="slug" dir="ltr" placeholder="my-shop" autocapitalize="off">
      <div class="tools"><button class="primary" id="create">יצירת הדף ומעבר לעריכה</button></div>`
    : !PUB ? `<p class="muted">לפני הפרסום אפשר לבנות דף אחד. דפים נוספים — אחרי הפרסום, לפי החבילה.</p>`
    : `<p>החבילה שלך כוללת ${L} ${L === 1 ? 'דף' : 'דפים'}, וכולם בשימוש.</p>
      ${upgrades().length ? `<p class="muted">לדף נוסף צריך לשדרג חבילה:</p><div class="tools">${upgrades().join('')}</div>` : `<p class="muted">לדפים נוספים פנו אלינו בוואטסאפ.</p>${SALES_PHONE ? `<a class="btn primary" target="_blank" href="https://wa.me/${SALES_PHONE}">וואטסאפ</a>` : ''}`}`}</div>
  ${window.SUPABASE_URL ? `<div class="card"><h2>סיסמה (לא חובה)</h2><small class="muted">כדי להיכנס בלי קוד מהמייל. בטלפון או מחשב חדש תמיד צריך קודם קוד.</small>
    <label>סיסמה חדשה</label><input id="newpw" type="password" dir="ltr" autocomplete="new-password" placeholder="לפחות 8 תווים">
    <div class="tools"><button id="savePw">שמירת הסיסמה</button></div></div>` : ''}
  <div class="card"><h2>מחיקת החשבון</h2><small class="muted">מוחק את העסק, כל הדפים, הפניות וההזמנות והתמונות. אי אפשר לשחזר.</small>
    <div class="tools"><button id="delAccount" style="color:#c0392b;border-color:#c0392b">מחיקת החשבון לצמיתות</button></div></div>`;
}
// מפורסם = שולם ותאריך החידוש לא עבר לפני יותר מ־14 יום (כמו בשרת). לפני תשלום — טיוטה שרק בעל העסק רואה
let PUB = false, REQ_PLAN = 1, REQ_FILL = '';
// לוגו: תמונה שהועלתה (עם תצוגה והסרה) או אימוג'י/אות
const logoPick = s => (s.logo_img ? `<img class="logo-prev" src="${esc(s.logo_img)}" alt="הלוגו"><button data-act="rmlogo">הסרת התמונה</button>`
  : `<input id="b_logo" value="${esc(s.logo)}" maxlength="4" placeholder="🌸" style="width:70px;text-align:center">`)
  + `<label class="btn">📷 ${s.logo_img ? 'החלפה' : 'העלאת תמונה'}<input type="file" id="logo_file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden></label>`;
const published = () => !!BIZ.renews_at && new Date(BIZ.renews_at).getTime() + 14 * 864e5 >= Date.now();
function publishCard() {
  const r = BIZ.request || {}, expired = !!BIZ.renews_at;
  REQ_PLAN = r.plan || REQ_PLAN; REQ_FILL = r.fill === true ? 'full' : r.fill || REQ_FILL;
  return `<div class="card" id="plan" style="border:2px solid var(--accent)"><h2>${expired ? '⏸️ הדף מושהה' : '🚀 פרסום הדף'}</h2>
    <p>${expired ? 'המנוי לא חודש, ולכן הדף לא מוצג לגולשים. התוכן שמור.' : 'הדף עוד לא מפורסם — כרגע רק אתם רואים אותו. בנו את הדף, ואז בחרו חבילה ושלחו בקשת פרסום. אחרי התשלום הדף עולה לאוויר.'}</p>
    <label>חבילה לשנה</label><div class="types">${Object.entries(PLANS).map(([n, p]) => `<button data-plan="${n}" aria-pressed="${+n === REQ_PLAN}">${n === '1' ? 'דף אחד' : n + ' דפים'}<br><b>${p} ₪</b></button>`).join('')}</div>
    <label>מי ממלא את הדף?</label><div class="fills">
      <button data-fill="" aria-pressed="${!REQ_FILL}"><b>אני ממלא בעצמי</b><small>בלי תוספת</small></button>
      ${Object.entries(FILLS).map(([k, f]) => `<button data-fill="${k}" aria-pressed="${REQ_FILL === k}"><b>מילוי ${f.label} · ${f.price} ₪</b><small>אנחנו: ${f.does}</small></button>`).join('')}</div>
    <div class="needs" ${REQ_FILL ? '' : 'hidden'}>⚠️ <b>את החומרים אתם שולחים לנו בוואטסאפ:</b> ${FILL_NEEDS}. אנחנו מנסחים ומסדרים — לא ממציאים תוכן.</div>
    <p class="total">סה"כ: <b>${PLANS[REQ_PLAN] + (FILLS[REQ_FILL] ? FILLS[REQ_FILL].price : 0)} ₪</b> <span class="muted">(${PLANS[REQ_PLAN]} ₪ לשנה${FILLS[REQ_FILL] ? ` + ${FILLS[REQ_FILL].price} ₪ מילוי חד־פעמי` : ''})</span></p>
    ${r.at ? `<p class="muted">✓ שלחתם בקשה ב־${new Date(r.at).toLocaleDateString('he-IL')} — נחזור אליכם בהקדם</p>` : ''}
    <div class="tools"><button class="primary" id="publish">${r.at ? 'שליחה חוזרת של הבקשה' : 'שליחת בקשת פרסום בוואטסאפ'}</button></div></div>`;
}
// חבילות לשנה. שדרוג באמצע שנה: (מחיר חדש − מחיר נוכחי) × חודשים שנשארו ÷ 12, תאריך החידוש לא משתנה
const PLANS = { 1: 200, 3: 500, 5: 800 };
function monthsLeft() {
  if (!BIZ.renews_at) return 12;
  const r = new Date(BIZ.renews_at), n = new Date(); let m = (r.getFullYear() - n.getFullYear()) * 12 + r.getMonth() - n.getMonth();
  if (r.getDate() > n.getDate()) m++;  // חודש שהתחיל נספר כחודש שלם
  return Math.min(12, Math.max(1, m));
}
function upgrades() {
  const L = BIZ.page_limit, m = monthsLeft(), when = BIZ.renews_at ? new Date(BIZ.renews_at).toLocaleDateString('he-IL') : '';
  if (!window.SALES_PHONE || !PLANS[L] || !PUB) return [];
  return Object.keys(PLANS).map(Number).filter(n => n > L).map(n => { const price = Math.round((PLANS[n] - PLANS[L]) * m / 12);
    const text = `שלום, אשמח לשדרג לחבילת ${n} דפים.\nלפי החישוב: (${PLANS[n]} − ${PLANS[L]}) × ${m} חודשים ÷ 12 = ${price} ₪${when ? `\nהחבילה ממשיכה להתחדש ב־${when}` : ''}`;
    return `<a class="btn primary" target="_blank" href="https://wa.me/${SALES_PHONE}?text=${encodeURIComponent(text)}">שדרוג ל־${n} דפים · ${price} ₪</a>`; });
}
// קישור לשיתוף: עותק קבוע של הדף עם תצוגה מקדימה בוואטסאפ (scripts/share-pages.mjs). עד שנוצר — 404.html מעביר לדף הרגיל
const shareUrl = slug => new URL('p/' + slug + '.html', location.href).href;
const TEMPLATES_LABEL = { classic: 'קלאסי', bold: 'בולט', minimal: 'נקי' };

// העלאת לוגו: תמונה או SVG ← מוקטן ל־512 ונשמר מיד
document.addEventListener('change', async e => {
  if (e.target.id !== 'logo_file' || !e.target.files[0]) return; const f = e.target.files[0];
  if (!/^image\/(png|jpeg|webp|svg\+xml)$/.test(f.type)) return msg('⚠️ אפשר להעלות רק PNG, JPG או SVG');
  if (f.size > 8e6) return msg('⚠️ הקובץ גדול מדי — עד 8MB');
  msg('מעלה את הלוגו…');
  try { const url = await DB.uploadLogo(await shrink(f, 512)); BIZ.settings = { ...BIZ.settings, logo_img: url }; await DB.saveBiz(BIZ.settings); $('logoPick').innerHTML = logoPick(BIZ.settings); msg('הלוגו הועלה ✓'); }
  catch (err) { msg('❌ ההעלאה נכשלה: ' + human(err)); }
});
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.copy) { const u = shareUrl(b.dataset.copy); navigator.clipboard.writeText(u).then(() => msg('הקישור הועתק ✓ אפשר להדביק בוואטסאפ'), () => prompt('הקישור לשיתוף:', u)); }
  if (b.dataset.plan) { REQ_PLAN = +b.dataset.plan; $('plan').outerHTML = publishCard(); }  // רק הכרטיס — בלי לאבד שדות שעוד לא נשמרו
  if (b.dataset.fill !== undefined) { REQ_FILL = b.dataset.fill; $('plan').outerHTML = publishCard(); }
  if (b.dataset.act === 'rmlogo') { BIZ.settings = { ...BIZ.settings, logo_img: '' }; try { await DB.saveBiz(BIZ.settings); $('logoPick').innerHTML = logoPick(BIZ.settings); msg('התמונה הוסרה'); } catch (err) { msg('❌ ' + human(err)); } }
  if (b.id === 'publish') {
    if (!BIZ.settings.name || !BIZ.settings.phone) return bad(BIZ.settings.name ? 'b_phone' : 'b_name', 'קודם ממלאים ושומרים את הגדרות העסק');
    const req = { plan: REQ_PLAN, fill: REQ_FILL || null, at: new Date().toISOString() }, F = FILLS[REQ_FILL];
    const text = `שלום, אשמח לפרסם את הדף שלי.\nעסק: ${BIZ.settings.name}\nמייל: ${EMAIL}\nחבילה: ${REQ_PLAN === 1 ? 'דף אחד' : REQ_PLAN + ' דפים'} · ${PLANS[REQ_PLAN]} ₪ לשנה`
      + (F ? `\nבנוסף: ${fillLabel(REQ_FILL)}\nסה"כ: ${PLANS[REQ_PLAN] + F.price} ₪\nאת החומרים (${FILL_NEEDS}) אשלח כאן` : '') + (PAGES.length ? '\nהדף: ' + PAGES.map(p => p.slug).join(', ') : '');
    window.open(`https://wa.me/${SALES_PHONE}?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
    try { await DB.saveRequest(req); BIZ.request = req; draw(); msg('✓ הבקשה נשלחה — נחזור אליכם בהקדם'); } catch (err) { msg('❌ ' + human(err)); }
  }
  if (b.dataset.pay) { PAY = b.dataset.pay; $('pay').innerHTML = payCard(); }  // רק הכרטיס — בלי לאבד שדות אחרים שעוד לא נשמרו
  if (b.id === 'savePay') {
    const method = PAY || (BIZ.settings.pay || {}).method || 'none', link = $('p_link') ? $('p_link').value.trim() : '', pay = { method };
    if (link && !/^https:\/\/\S+\.\S+/.test(link)) return bad('p_link', 'הקישור לא תקין — צריך להתחיל ב־https://');
    if ((method === 'paybox' || method === 'link') && !link) return bad('p_link', 'צריך להדביק את הקישור לתשלום');
    if (link) pay.link = link;
    if (method === 'bit') { const ph = $('p_phone').value.replace(/\D/g, '');
      if (!/^(05\d{8}|9725\d{8})$/.test(ph)) return bad('p_phone', 'מספר הטלפון לא תקין — 10 ספרות שמתחילות ב־05');
      pay.phone = ph.replace(/^0/, '972'); }
    const s = { ...BIZ.settings, pay };
    try { await DB.saveBiz(s); BIZ.settings = s; PAY = null; msg('✓ נשמר — ' + (method === 'none' ? 'הלקוחות ישלחו הזמנה בוואטסאפ בלבד' : 'אחרי הזמנה הלקוחות יראו כפתור תשלום' + (method === 'link' ? '' : ' ב' + PAY_WAYS[method]))); } catch (err) { msg('❌ שגיאה בשמירה: ' + human(err)); }
  }
  if (b.dataset.type) { TYPE = b.dataset.type; document.querySelectorAll('[data-type]').forEach(x => x.setAttribute('aria-pressed', x === b)); }
  if (b.id === 'saveBiz') {
    const ph = $('b_phone').value.replace(/\D/g, '');
    if (!$('b_name').value.trim()) return bad('b_name', 'צריך למלא את שם העסק');
    if (!ph) return bad('b_phone', 'צריך למלא מספר וואטסאפ — אליו מגיעות ההזמנות');
    if (!/^(05\d{8}|9725\d{8})$/.test(ph)) return bad('b_phone', 'מספר הוואטסאפ לא תקין — 10 ספרות שמתחילות ב־05');
    const s = { ...BIZ.settings, name: $('b_name').value.trim(), logo: $('b_logo') ? $('b_logo').value.trim() : BIZ.settings.logo || '', accent: $('b_accent').value,
      phone: $('b_phone').value.replace(/\D/g, '').replace(/^0/, '972'), address: $('b_address').value.trim() };
    try { await DB.saveBiz(s); BIZ.settings = s; msg('ההגדרות נשמרו ✓'); } catch (err) { msg('❌ שגיאה בשמירה: ' + human(err)); }
  }
  if (b.id === 'create') {
    const slug = $('slug').value.trim().toLowerCase();
    if (!slug) return bad('slug', 'צריך למלא כתובת לדף, למשל my-shop');
    if (/[^a-z0-9-]/.test(slug)) return bad('slug', 'בכתובת מותר רק אותיות באנגלית, מספרים ומקף (בלי רווחים ועברית)');
    if (slug.length < 3 || slug.length > 40) return bad('slug', 'הכתובת צריכה להיות באורך 3 עד 40 תווים');
    const { label, name, phone, address, accent, logo, ...content } = structuredClone(PRESETS[TYPE]);
    content.type = TYPE; content.template = 'classic';
    try {
      await DB.addPage(slug, content);
      // עסק בלי לוגו — מתחילים מהלוגו והצבע של סוג הדף
      if (!BIZ.settings.logo) await DB.saveBiz({ ...BIZ.settings, logo, accent });
      location.href = href('edit.html', 's=' + slug);
    } catch (err) { /duplicate|unique/i.test(err.message) ? bad('slug', 'הכתובת הזו כבר תפוסה — נסו אחרת') : msg('❌ ' + (/limit|row-level/i.test(err.message) ? 'הגעתם למכסת הדפים בחבילה' : 'שגיאה: ' + human(err))); }
  }
  if (b.id === 'savePw') {
    const pw = $('newpw').value;
    if (pw.length < 8) return bad('newpw', 'הסיסמה צריכה להיות לפחות 8 תווים');
    b.disabled = true;
    try { await setPassword(pw); $('newpw').value = ''; msg('✓ הסיסמה נשמרה. במכשיר הזה אפשר להיכנס איתה בלי קוד'); }
    catch (err) { msg('❌ ' + (/reauth|recent/i.test(err.message) ? 'מטעמי אבטחה צריך להיכנס שוב עם קוד, ואז לשמור את הסיסמה' : /same|different/i.test(err.message) ? 'זו כבר הסיסמה שלך' : /weak|short|characters/i.test(err.message) ? 'הסיסמה חלשה מדי — נסו סיסמה ארוכה יותר' : 'שגיאה: ' + human(err))); }
    b.disabled = false;
  }
  if (b.id === 'delAccount' && confirm('למחוק את החשבון לצמיתות?\nיימחקו העסק, כל הדפים (הם יירדו מהאוויר), הפניות, ההזמנות והתמונות. אי אפשר לשחזר.')) {
    b.disabled = true; msg('מוחק את החשבון…');
    try { await DB.deleteAccount(); $('app').innerHTML = '<h1>החשבון נמחק</h1><div class="card"><p>כל הנתונים שלך נמחקו. תודה שהייתם איתנו.</p></div>'; }
    catch (err) { b.disabled = false; msg('❌ המחיקה נכשלה: ' + human(err)); }
  }
  if (b.dataset.del && confirm('למחוק את הדף לצמיתות?')) {
    try { await DB.delPage(b.dataset.del); PAGES = PAGES.filter(p => p.slug !== b.dataset.del); draw(); msg('הדף נמחק'); } catch (err) { msg('❌ שגיאה: ' + human(err)); }
  }
});

(async () => {
  if (!(await connect())) return;
  [BIZ, PAGES] = await Promise.all([DB.biz(), DB.pages()]);
  draw(); DB.leads().then(l => { NEWLEADS = l.filter(x => x.status === 'new').length; if (NEWLEADS) draw(); }).catch(() => {});  // לא מעכב את המסך
})();
</script>
</body>
</html>
