<!doctype html>
<html lang="he" dir="rtl" data-themed>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ניהול העסק</title>
<link rel="preconnect" href="https://feshcsgtkfftmehbslyh.supabase.co" crossorigin>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#2563eb">
<style>
:root{--bg:#f5f3ef;--card:#fff;--ink:#222;--muted:#777;--line:#e2ddd5;--accent:#2563eb}
:root[data-theme=dark]{--bg:#141414;--card:#1f1f1f;--ink:#eee;--muted:#999;--line:#333;color-scheme:dark}  /* בהיר כברירת מחדל גם כשהטלפון במצב כהה; כהה רק בבחירה (כפתור 🌙) */
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",Arial,sans-serif}
.wrap{max-width:720px;margin:auto;padding:16px 16px 60px}
h1{font-size:22px;margin:8px 0 16px}h2{font-size:18px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 2px}
input,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=color]{height:44px;padding:4px}
.pvwrap{position:sticky;top:0;z-index:5;background:var(--card);padding:6px 0 8px;margin:8px 0}.pvwrap iframe{display:block;width:100%;height:300px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:4px}
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}.pals button{display:flex;align-items:center;gap:8px;text-align:right;padding:8px 10px;font-size:14px}.pals button[aria-pressed=true]{outline:2px solid var(--accent);font-weight:700}.dot{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid #0002}.cprev{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0;padding:12px;border:1px dashed var(--line);border-radius:12px}.cprev span{color:#fff;font-weight:700;border-radius:99px;padding:6px 14px;font-size:14px}.cprev .pv-btn{border-radius:12px;padding:10px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}@media (max-width:640px){.grid2{grid-template-columns:1fr}}  /* בטלפון: שדה אחד בכל שורה, ברוחב מלא */
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-block}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}small{display:block}
.page{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.page:first-of-type{border:0}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
/* לוגו וחבילות מילוי */
.logo-pick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.logo-prev{width:56px;height:56px;object-fit:contain;border:1px solid var(--line);border-radius:12px;background:#fff}
.fills{display:grid;gap:8px}.fills button{text-align:right;padding:10px 12px}.fills button[aria-pressed=true]{outline:2px solid var(--accent)}.fills small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.needs{background:#fff4e5;color:#7a3e00;border-radius:10px;padding:10px;margin-top:10px;font-size:14px}.total{margin:12px 0 0;font-size:17px}
.types button{padding:12px;text-align:center}.types button[aria-pressed=true]{outline:2px solid var(--accent);font-weight:700}
#msg{text-align:center;font-weight:700;min-height:22px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-left:52px}.topbar h1{margin:8px 0 12px}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;padding:10px 4px;font-size:14px}.linkbtn.danger{color:#c0392b}
details.card>summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:2px;padding-inline-end:28px;position:relative;min-height:28px}
details.card>summary::-webkit-details-marker{display:none}details.card>summary::after{content:'▾';position:absolute;left:2px;top:0;font-size:18px;color:var(--muted)}details.card[open]>summary::after{content:'▴'}details.card[open]>summary{margin-bottom:8px}
details.sub{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}details.sub>summary{cursor:pointer;font-weight:700;color:var(--accent);padding:8px 0}
.num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:15px;margin-inline-end:6px}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;background:#fff4e5;color:#7a3e00}.chip.live{background:#e7f6ec;color:#1f7a45}
.page{flex-direction:column;align-items:stretch}.pinfo small{margin-top:2px}.pbtns{margin:6px 0 0}.page .linkbtn.danger{align-self:flex-start;padding:6px 0}
.slugbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding-inline-start:10px}.slugbox span{color:var(--muted);white-space:nowrap}.slugbox input{border:0;background:none;padding-inline-start:2px}
.big{font-size:17px;padding:12px 18px;width:100%}.types .ti{display:block;font-size:22px}
.chkbtn{display:flex;align-items:center;gap:10px}.chkbtn .box{flex:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.chkbtn[aria-pressed=true]{outline:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--card));font-weight:700}.chkbtn[aria-pressed=true] .box{background:var(--accent);border-color:var(--accent)}
input:placeholder-shown,textarea:placeholder-shown{direction:rtl;text-align:right}  /* טקסט המילוי (placeholder) בעברית — מימין, גם בשדות שמקלידים בהם באנגלית */
</style>
</head>
<body>
<div class="wrap" id="app">טוען…</div>
<script src="config.js"></script>
<script src="presets.js"></script>
<script src="admin-lib.js"></script>
<script>
// ניהול: הגדרות כלליות של העסק + רשימת הדפים + יצירת דף חדש (עד מכסת החבילה)
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let BIZ, PAGES, NEWLEADS = 0, TYPE = 'seasonal', PAY;

// תצוגה מקדימה חיה: הדף האמיתי בתוך מסגרת (אותו אתר), והצבעים מוחלים עליו ישירות בלי שמירה
function pvApply(accent, harmony) { const f = $('pvf'); if (!f) return; try { const w = f.contentWindow; w.PV_COLORS = { accent, harmony }; w.applyColors && w.applyColors(w.PV_COLORS); } catch {} }
// צבעים: ערכה מוכנה, או צבע ראשי משלכם + כלל שבוחר את הצבע המשני (config.js: palette)
const dot = (a, b) => `<span class="dot" style="background:linear-gradient(90deg,${a} 50%,${b} 50%)"></span>`;
function colorPick(accent, harmony) {
  return `<label>ערכת צבעים מוכנה</label><div class="pals">${PALETTES.map(([n, c, h]) => { const q = palette(c, h); return `<button data-pal="${c}|${h}" aria-pressed="${c === accent && h === harmony}">${dot(q.accent, q.accent2)}${n}</button>`; }).join('')}</div>
    <label>או צבע ראשי משלכם</label><input id="b_accent" type="color" value="${esc(accent)}"><div id="cbody">${colorBody(accent, harmony)}</div>`;
}
// החלק שמתעדכן בזמן גרירת הצבע (בלי לבנות מחדש את בוחר הצבע עצמו, כדי שלא ייסגר)
function colorBody(accent, harmony) {
  const p = palette(accent, harmony); pvApply(accent, harmony);
  return `<label>הצבע המשני נבחר לבד, לפי כלל עיצוב:</label><input type="hidden" id="b_harmony" value="${harmony}">
    <div class="pals">${Object.entries(HARMONIES).map(([k, [n, d]]) => { const q = palette(accent, k); return `<button data-harm="${k}" aria-pressed="${k === harmony}" title="${d}">${dot(q.accent, q.accent2)}${n}</button>`; }).join('')}</div>
    <small class="muted">${HARMONIES[harmony][1]}</small>
    ${p.adjusted ? '<small class="muted">הצבע הראשי הוכהה מעט, כדי שטקסט לבן עליו יהיה קריא.</small>' : ''}`;
}
// תשלום מהלקוחות: בעל העסק בוחר ביט / פייבוקס / קישור משלו / בלי. אחרי הזמנה הלקוח רואה כפתור תשלום עם הסכום
const A = (u, t) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`;
const PAY_HELP = {
  none: 'הלקוח שולח את ההזמנה בוואטסאפ, ואת התשלום אתם מסכמים איתו.',
  bit: `הלקוח מעביר לכם בביט למספר הטלפון שלכם — הסכום והמספר מוצגים לו אחרי ההזמנה.<br>אפשר להוסיף גם קישור: באפליקציית ביט לוחצים "קבוצה" ← איסוף כסף ← "סכום פתוח", ומשתפים את הלינק. שימו לב שקבוצה נסגרת בסוף התקופה שבחרתם.<br>ביט פרטי: קבלת כסף חינם עד 25,000 ₪ בשנה, מעבר לזה עמלה של 0.8%. ${A('https://www.bitpay.co.il/he/private-faq', 'שאלות נפוצות של ביט')} · ${A('https://www.bitpay.co.il/he/bit-for-businesses', 'ביט לעסקים')}`,
  paybox: `באפליקציית פייבוקס פותחים קבוצה ציבורית לתשלומים ומשתפים את הקישור שלה (לחיצה על "שיתוף" בקבוצה). מדביקים את הקישור כאן. הלקוח יקליד בפייבוקס את הסכום שמוצג לו. ${A('https://www.payboxapp.com/groups', 'קבוצות בפייבוקס')} · ${A('https://www.payboxapp.com/business', 'פייבוקס לעסקים')}`,
  link: 'דף תשלום שקיבלתם מחברת סליקה (למשל Grow, חשבונית ירוקה, Cardcom או PayPal). מדביקים כאן את הקישור, והלקוח יקליד בו את הסכום שמוצג לו.',
};
PAY_HELP.bank = 'פרטי החשבון יוצגו ללקוח אחרי ההזמנה, עם כפתור העתקה.';
PAY_HELP.cash = 'הלקוח יראה שאפשר לשלם במזומן באיסוף או במסירה.';
// אפשרויות שמסומנות כרגע (גם לפני שמירה) + מה שכבר הוקלד בשדות — כדי שסימון נוסף לא ימחק את מה שהוקלד
let PAYSEL = null;
const payRead = () => { if (!PAYSEL) return; for (const k in PAYSEL) for (const f of ['phone', 'link', 'details']) { const el = $(`p_${k}_${f}`); if (el) PAYSEL[k][f] = el.value; } };
function payCard() {
  if (!PAYSEL) { PAYSEL = structuredClone(payWays(BIZ.settings.pay)); for (const k in PAYSEL) if (PAYSEL[k].phone) PAYSEL[k].phone = '0' + String(PAYSEL[k].phone).replace(/^972/, ''); }
  const fld = (k, f, label, attrs = '') => `<label>${label}</label>${f === 'details' ? `<textarea id="p_${k}_${f}" rows="3" placeholder="למשל: בנק לאומי, סניף 123, חשבון 456789, על שם ישראל ישראלי">${esc(PAYSEL[k][f] || '')}</textarea>` : `<input id="p_${k}_${f}" ${attrs} value="${esc(PAYSEL[k][f] || '')}">`}`;
  const LINK = 'dir="ltr" inputmode="url" placeholder="מדביקים כאן את הקישור"';
  const parts = { bit: () => fld('bit', 'phone', 'מספר הטלפון שמחובר לביט', 'inputmode="tel"') + fld('bit', 'link', 'קישור לתשלום בביט (לא חובה)', LINK),
    paybox: () => fld('paybox', 'link', 'הקישור לקבוצה בפייבוקס', LINK), link: () => fld('link', 'link', 'הקישור לדף התשלום', LINK),
    bank: () => fld('bank', 'details', 'פרטי החשבון להעברה'), cash: () => '' };
  return `<small class="muted">הכסף עובר ישר אליכם. סמנו את כל האפשרויות שמתאימות לכם, והלקוח יבחר אחרי ההזמנה איך לשלם</small>
    <div class="fills" style="margin-top:10px">${Object.entries(PAY_WAYS).map(([k, l]) => `<button class="chkbtn" data-pay="${k}" role="checkbox" aria-checked="${!!PAYSEL[k]}" aria-pressed="${!!PAYSEL[k]}"><span class="box" aria-hidden="true">${PAYSEL[k] ? '✓' : ''}</span>${l}</button>`).join('')}</div>
    ${Object.keys(PAY_WAYS).filter(k => PAYSEL[k]).map(k => `<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:8px"><b>${PAY_WAYS[k]}</b><p class="muted" style="font-size:14px;margin:4px 0">${PAY_HELP[k]}</p>${parts[k]()}</div>`).join('')
      || `<p class="muted" style="font-size:14px">${PAY_HELP.none}</p>`}
    <div class="tools"><button class="primary" id="savePay">שמירת אפשרויות התשלום</button></div>`;
}

// משתמש בלי דף: פתיחה בשלושה צעדים — פרטי העסק ← סוג ← כתובת ← ישר לעורך. פרסום ותשלום רק אחרי שיש דף
function onboarding() {
  const s = BIZ.settings;
  $('app').innerHTML = `${topbar('ברוכים הבאים! 👋')}<p class="muted" style="margin-top:-8px">בונים את הדף בשלושה צעדים קצרים. הבנייה בחינם. כשהדף מוכן ורוצים שהלקוחות יראו אותו — 200 ₪ לשנה.</p><div id="msg"></div>
  <div class="card"><h2><span class="num">1</span> פרטי העסק</h2>
    <label>שם העסק</label><input id="b_name" value="${esc(s.name)}" placeholder="למשל: המטבח של רחל">
    <label>וואטסאפ — לכאן יגיעו ההזמנות</label><input id="b_phone" inputmode="tel" dir="ltr" placeholder="למשל 0501234567" value="${s.phone ? '0' + String(s.phone).replace(/^972/, '') : ''}"></div>
  <div class="card"><h2><span class="num">2</span> סוג העסק</h2><small class="muted">הדף מתחיל עם תוכן לדוגמה שמתאים לסוג, ואתם מחליפים בפרטים שלכם</small>
    <div class="types" style="margin-top:10px">${typeBtns()}</div></div>
  <div class="card"><h2><span class="num">3</span> כתובת הדף</h2><small class="muted">הקישור שתשלחו ללקוחות. באנגלית — הצענו לפי שם העסק, ואפשר לשנות</small>
    ${slugField()}
    <div class="tools"><button class="primary big" id="create">יצירת הדף ומעבר לעריכה ←</button></div></div>
  <p class="muted" style="font-size:14px;text-align:center">אחרי שהדף מוכן: בוחרים חבילה ומפרסמים. לוגו, צבעים ואפשרויות תשלום — בהגדרות, מתי שנוח.</p>`;
  if (s.name && !$('slug').value) suggestSlug(s.name);
}
const topbar = t => `<div class="topbar"><h1>${t}</h1>${window.SUPABASE_URL ? '<button id="logout" class="linkbtn">יציאה</button>' : ''}</div>`;
const typeBtns = () => Object.entries(PRESETS).map(([k, p]) => `<button data-type="${k}" aria-pressed="${k === TYPE}"><span class="ti">${p.logo}</span>${p.label}</button>`).join('');
const slugField = () => `<label>כתובת הדף (אותיות באנגלית, מספרים ומקף)</label><div class="slugbox" dir="ltr"><span>dafbiz.com/</span><input id="slug" dir="ltr" placeholder="my-shop" autocapitalize="off" autocomplete="off" spellcheck="false"></div><small id="slugst" class="muted"></small>`;
// כתובת מוצעת לפי שם העסק (תעתיק פשוט מעברית). בעל העסק יכול לשנות
const HE = { 'א': 'a', 'ב': 'b', 'ג': 'g', 'ד': 'd', 'ה': 'h', 'ו': 'v', 'ז': 'z', 'ח': 'ch', 'ט': 't', 'י': 'y', 'כ': 'k', 'ך': 'ch', 'ל': 'l', 'מ': 'm', 'ם': 'm', 'נ': 'n', 'ן': 'n', 'ס': 's', 'ע': 'a', 'פ': 'p', 'ף': 'f', 'צ': 'tz', 'ץ': 'tz', 'ק': 'k', 'ר': 'r', 'ש': 'sh', 'ת': 't' };
function translit(name) {
  return name.toLowerCase().split(/\s+/).map(w => [...w].map((c, i, a) => c === 'ו' && i && i < a.length - 1 && a[i + 1] !== 'ו' ? 'o' : c === 'י' && i && i < a.length - 1 ? 'i' : c === 'ה' && i === a.length - 1 && i ? 'a' : c === 'ו' && a[i - 1] === 'ו' ? '' : HE[c] ?? (/[a-z0-9]/.test(c) ? c : '')).join(''))
    .filter(Boolean).join('-').replace(/-+/g, '-').slice(0, 30).replace(/^-|-$/g, '');
}
let slugTouched = false, slugTimer;
function suggestSlug(name) { if (slugTouched || !$('slug')) return; const v = translit(name); $('slug').value = v.length >= 3 ? v : ''; checkSlug(); }
// בדיקה מיידית אם הכתובת פנויה (page_status: none = אין דף כזה)
function checkSlug() { clearTimeout(slugTimer); const v = $('slug').value.trim().toLowerCase(), st = $('slugst'); if (!st) return;
  if (!v) return st.textContent = ''; if (/[^a-z0-9-]/.test(v)) return st.textContent = '⚠️ רק אותיות באנגלית, מספרים ומקף'; if (v.length < 3) return st.textContent = 'לפחות 3 תווים';
  if (!window.SUPABASE_URL) return st.textContent = '';
  slugTimer = setTimeout(async () => { const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/page_status`, { method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Profile': 'tiny', 'Content-Type': 'application/json' }, body: JSON.stringify({ p_slug: v }) }).then(r => r.json()).catch(() => null);
    if ($('slug') && $('slug').value.trim().toLowerCase() === v && r) st.innerHTML = r.state === 'none' ? '<span style="color:#1f8a4c">✓ הכתובת פנויה</span>' : '⚠️ הכתובת הזו כבר תפוסה — נסו אחרת'; }, 350); }

function draw() {
  const s = BIZ.settings, L = BIZ.page_limit, can = PAGES.length < L; PUB = published();
  if (!PAGES.length) return onboarding();
  const ways = Object.keys(payWays(s.pay)).map(k => PAY_WAYS[k]);
  $('app').innerHTML = `${topbar('ניהול העסק')}<div id="msg"></div>
  <a class="card head" style="display:flex;text-decoration:none;color:inherit" href="${href('leads.html')}"><h2>📥 פניות והזמנות</h2><span id="newleads" class="${NEWLEADS ? 'primary btn' : 'muted'}">${NEWLEADS ? NEWLEADS + ' חדשות' : 'אין חדשות'} ←</span></a>
  <div class="card"><div class="head"><h2>${PAGES.length > 1 ? 'הדפים שלי' : 'הדף שלי'}</h2><span class="muted">${PAGES.length} מתוך ${L} בחבילה</span></div>
    ${PAGES.map(p => `<div class="page"><div class="pinfo"><b>${esc(p.content.tagline || (PRESETS[p.content.type] || {}).label || p.slug)}</b>
      <small><span class="chip ${PUB ? 'live' : ''}">${PUB ? '● מפורסם' : 'טיוטה — רק אתם רואים'}</span> <span class="muted" dir="ltr">dafbiz.com/${esc(p.slug)}</span></small></div>
      <div class="tools pbtns"><a class="btn primary" href="${href('edit.html', 's=' + encodeURIComponent(p.slug))}">✏️ עריכה</a>
      <a class="btn" href="${href('index.html', 's=' + encodeURIComponent(p.slug))}" target="_blank">צפייה</a>
      ${PUB ? `<button data-copy="${esc(p.slug)}">🔗 העתקת קישור</button>` : ''}</div>

    try { await DB.delPage(b.dataset.del); PAGES = PAGES.filter(p => p.slug !== b.dataset.del); draw(); msg('הדף נמחק'); } catch (err) { msg('❌ שגיאה: ' + human(err)); }
  }
});

(async () => {
  if (!(await connect())) return;
  [BIZ, PAGES] = await Promise.all([DB.biz(), DB.pages()]);
  draw(); DB.leads().then(l => { NEWLEADS = l.filter(x => x.status === 'new').length; const n = $('newleads'); if (NEWLEADS && n) { n.className = 'primary btn'; n.textContent = NEWLEADS + ' חדשות ←'; } }).catch(() => {});  // לא מעכב את המסך ולא בונה אותו מחדש
})();
</script>
</body>
</html>
