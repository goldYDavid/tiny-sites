<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><!-- שלב בדיקות: להסיר לפני השקה -->
<title>שם העסק — מוצרי חנוכה איכותיים במחירים הוגנים</title>
<base href="../"><script>window.PAGE_SLUG = "demo"</script>
<meta name="description" content="הזמנה בוואטסאפ">
<meta property="og:type" content="website"><meta property="og:locale" content="he_IL">
<meta property="og:url" content="https://goldydavid.github.io/tiny-sites/p/demo.html"><meta property="og:title" content="שם העסק — מוצרי חנוכה איכותיים במחירים הוגנים"><meta property="og:description" content="הזמנה בוואטסאפ">
<meta property="og:image" content="https://goldydavid.github.io/tiny-sites/p/demo.jpg?v=1793354525"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://feshcsgtkfftmehbslyh.supabase.co" crossorigin>
<link rel="stylesheet" href="site.css">
</head>
<body>
<div class="wrap" id="app"><div class="skel"></div></div>
<div class="bar"><a id="cta" href="#" target="_blank" rel="noopener">וואטסאפ</a></div>
<script src="config.js"></script>
<script src="render.js"></script>
<script src="presets.js"></script>
<script>
// הצגה: קודם מהמטמון (מיידי), ואז עדכון מהשרת ברקע
const qs = new URLSearchParams(location.search), slug = qs.get('s') || window.PAGE_SLUG || window.SITE_SLUG,  // PAGE_SLUG: עותק קבוע של הדף ב-p/ (תצוגה מקדימה בוואטסאפ)
      demo = qs.get('demo');
let SITE, cart = {}, ORDER = { items: [] };
function render(site) {
  SITE = site; document.title = `${site.name} — ${site.tagline}`;
  document.documentElement.style.setProperty('--accent', site.accent || '#c8741a');
  const app = document.getElementById('app'); app.className = 'wrap t-' + (site.template || 'classic');
  app.innerHTML = (site.draft ? '<div class="draft">טיוטה — הדף עוד לא מפורסם, ורק אתם רואים אותו</div>' : '') + renderSite(site, false, cart);
  update();
}
function update() {
  const lines = []; let sum = 0;
  for (const [k, q] of Object.entries(cart)) if (q) { const [si, ii] = k.split('-'), it = SITE.sections[si].items[ii]; lines.push(`${q} × ${it.name}`); sum += q * it.price; }
  const text = lines.length ? `שלום, אשמח להזמין:\n${lines.join('\n')}\nסה"כ: ${Math.round(sum * 100) / 100} ₪` : `שלום, הגעתי מהאתר של ${SITE.name}`;
  const a = document.getElementById('cta'); ORDER = { items: lines, total: Math.round(sum * 100) / 100 };
  a.href = `https://wa.me/${SITE.phone}?text=${encodeURIComponent(text)}`;
  a.textContent = lines.length ? `${SITE.cta || 'הזמנה בוואטסאפ'} · ${Math.round(sum * 100) / 100} ₪` : (SITE.cta || 'וואטסאפ');
  if (demo) { a.href = 'admin.html'; a.removeAttribute('target'); a.textContent = 'רוצים דף כזה לעסק שלכם? מתחילים בחינם ←'; }  // דף לדוגמה ← הרשמה
}
// טופס השארת פרטים ← נשמר בפניות של בעל העסק + נפתחת הודעת וואטסאפ מוכנה אליו (כדי שיידע מיד)
document.addEventListener('submit', e => { const f = e.target.closest('form[data-lead]'); if (!f) return; e.preventDefault();
  const { website, ...d } = Object.fromEntries(new FormData(f)), section = SITE.sections[f.dataset.lead].title;
  const thanks = '<p class="ok">✓ תודה! הפרטים התקבלו ונחזור אליכם בהקדם</p>';
  if (website) return f.innerHTML = thanks;  // שדה נסתר שרק תוכנות ספאם ממלאות
  if (demo) return f.innerHTML = thanks + '<p class="muted">זו דוגמה — בדף שלכם הפנייה תגיע אליכם לוואטסאפ ולמסך הניהול</p>';
  sendLead(slug, 'lead', { ...d, section }).catch(() => {});
  const text = `שלום, השארתי פרטים באתר (${section}):\nשם: ${d.name}\nטלפון: ${d.phone}${d.message ? '\n' + d.message : ''}`;
  window.open(`https://wa.me/${SITE.phone}?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
  f.innerHTML = thanks + '<p class="muted">נפתחה הודעת וואטסאפ — לחצו "שליחה" כדי שבעל העסק יקבל אותה מיד</p>'; });
// הזמנה מהעגלה נרשמת גם בניהול (בלי לעכב את המעבר לוואטסאפ)
document.getElementById('cta').addEventListener('click', () => { if (ORDER.items.length && !demo) sendLead(slug, 'order', ORDER).catch(() => {}); });
document.addEventListener('click', e => { const b = e.target.closest('.qty button'); if (!b) return;
  const k = b.dataset.k; cart[k] = Math.max(0, (cart[k] || 0) + +b.dataset.d); document.getElementById('q' + k).textContent = cart[k]; update(); });

(async () => {
  if (demo) { render({ phone: '972500000000', ...PRESETS[demo], template: qs.get('t') }); return document.getElementById('app').insertAdjacentHTML('afterbegin', '<div class="draft" style="background:#2563eb">דף לדוגמה — כך ייראה הדף של העסק שלכם</div>'); }
  const key = 'site:' + slug;
  try { const c = localStorage.getItem(key); if (c) render(JSON.parse(c)); } catch {}
  const fresh = await window.loadSite(slug).catch(() => 'offline');  // בלי רשת ← נשארים עם העותק השמור
  if (fresh && fresh.paused) { try { localStorage.removeItem(key); } catch {} document.title = fresh.name || 'הדף בהשהיה';
    document.querySelector('.bar').remove(); return document.getElementById('app').innerHTML = '<p class="paused">הדף בהשהיה זמנית</p>'; }
  if (fresh === 'offline') { if (!SITE) document.getElementById('app').innerHTML = '<p class="paused">אין חיבור לאינטרנט — נסו שוב</p>'; return; }
  if (fresh) { try { localStorage.setItem(key, JSON.stringify(fresh)); } catch {} if (JSON.stringify(fresh) !== JSON.stringify(SITE)) render(fresh); }
  else { try { localStorage.removeItem(key); } catch {} document.querySelector('.bar').remove(); document.getElementById('app').innerHTML = '<p class="paused">הדף לא זמין כרגע</p>'; }  // לא קיים / לא מפורסם
})();
</script>
</body>
</html>
