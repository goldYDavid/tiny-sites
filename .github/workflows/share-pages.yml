# כל שעה: תמונות ותגיות לתצוגה מקדימה בוואטסאפ לכל דף עסק (p/<slug>.html + .jpg). לא רץ בשבת ובחג.
name: share-pages
on:
  schedule: [{ cron: '17 * * * *' }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: share-pages
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: s
        run: node .github/shabbat.mjs
      - if: steps.s.outputs.shabbat != 'true'
        run: |
          cd /tmp && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE" && (python3 -m http.server 8765 >/dev/null 2>&1 &) && sleep 1
          PLAYWRIGHT=/tmp/node_modules/playwright/index.mjs node .github/share-pages.mjs
          git add p && if ! git diff --cached --quiet; then
            git -c user.name=share-pages -c user.email=actions@github.com commit -m "Update share previews" && git push
          fi
